# Cloudflare Workers — static Astro site (no SSR adapter).
# Build: npm run build
# Deploy: npx wrangler deploy
# Uploads only dist/ assets + workers/host-redirect.js (no .env / secrets).

name = "buy-dbd-cheats"
main = "./workers/host-redirect.js"
compatibility_date = "2026-10-27"
workers_dev = true

# Apex + www on this Worker; host-redirect.js 301s apex → www
routes = [
  { pattern = "buydbdcheats.com", custom_domain = true },
  { pattern = "www.buydbdcheats.com", custom_domain = true },
]

[assets]
directory = "./dist"
binding = "ASSETS"
# Host redirect must run before asset matching or HTML pages would skip the Worker
run_worker_first = true
# Match Astro trailingSlash: 'always'
html_handling = "force-trailing-slash"
# Serve dist/404.html for unknown routes
not_found_handling = "404-page"

[observability]
enabled = true
